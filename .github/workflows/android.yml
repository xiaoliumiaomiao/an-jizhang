name: Android verification

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Android SDK tools
        run: bash .github/scripts/setup-android.sh
      - name: Verify wrapper and SDK
        run: |
          echo 'c5a643cf80162e665cc228f7b16f343fef868e47d3a4836f62e18b7e17ac018a  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          chmod +x gradlew
          sdkmanager 'platforms/android-35' 'build-tools/35.0.0' 'platform-tools'
      - name: Unit tests, lint and APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/

  device-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Android SDK tools
        run: bash .github/scripts/setup-android.sh
      - name: Prepare emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'platforms/android-35' 'build-tools/35.0.0' 'platform-tools' 'emulator' 'system-images/android-35/google_apis/x86_64'
          echo no | avdmanager create avd -n ci-ledger -k 'system-images;android-35;google_apis;x86_64' --device pixel_5
          "$ANDROID_HOME/emulator/emulator" -avd ci-ledger -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Android UI smoke test
        run: |
          chmod +x gradlew
          ./gradlew :app:connectedDebugAndroidTest --no-daemon
          adb shell am start -n com.xiaoliumiaomiao.anjizhang/.MainActivity
          sleep 3
          adb exec-out screencap -p > device-screen.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            device-screen.png
