name: Android verification

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Android SDK tools
        run: bash .github/scripts/setup-android.sh
      - name: Verify wrapper and SDK
        run: |
          echo 'c5a643cf80162e665cc228f7b16f343fef868e47d3a4836f62e18b7e17ac018a  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          chmod +x gradlew
          sdkmanager 'platforms/android-35' 'build-tools/35.0.0' 'platform-tools'
      - name: Unit tests, lint and APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/

  device-smoke:
    runs-on: ubuntu-24.04
    # Runs the full ordinary UI suite, then a separate raw schema1 -> schema2 replacement chain.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout fixed 0.1.4 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c476eac220ba3f062200365671a674e5decfd06d
          path: baseline-v014
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Android SDK tools
        run: bash .github/scripts/setup-android.sh
      - name: Prepare emulator
        timeout-minutes: 12
        run: |
          diagnose_emulator() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "Emulator preparation failed: $result"
              if [ -n "${emulator_pid:-}" ]; then ps -p "$emulator_pid" -o pid,stat,args || true; fi
              timeout 10s adb devices -l || true
              if [ -f emulator.log ]; then tail -n 160 emulator.log; fi
            fi
          }
          trap diagnose_emulator EXIT
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          sdkmanager 'platforms/android-35' 'build-tools/35.0.0' 'platform-tools' 'emulator' 'system-images/android-35/google_apis/x86_64'
          avd_path="$RUNNER_TEMP/ci-ledger.avd"
          echo no | avdmanager create avd -n ci-ledger -k 'system-images;android-35;google_apis;x86_64' --device pixel_5 --path "$avd_path"
          # The default 12 GiB userdata exceeds free disk on hosted runners.
          # This fresh CI AVD contains only test data; no user device is modified.
          sed -i '/^disk.dataPartition.size=/d' "$avd_path/config.ini"
          printf '\ndisk.dataPartition.size=4G\n' >> "$avd_path/config.ini"
          df -h "$RUNNER_TEMP"
          # Bare ldd lacks library paths supplied by the emulator launcher.
          # Collect diagnostics; actual launcher commands below decide failure.
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" > emulator-libs.log 2>&1 || true
          cat emulator-libs.log
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd ci-ledger -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -verbose > emulator.log 2>&1 &
          emulator_pid=$!
          # The single fresh AVD uses the emulator's default console port.
          serial=emulator-5554
          timeout 180s adb -s "$serial" wait-for-device
          for i in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then exit 1; fi
            boot_completed="$(timeout 10s adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = '1' ]; then break; fi
            sleep 2
          done
          test "${boot_completed:-}" = '1'
          timeout 10s adb -s "$serial" shell input keyevent 82
          timeout 10s adb -s "$serial" shell settings put global window_animation_scale 0
          timeout 10s adb -s "$serial" shell settings put global transition_animation_scale 0
          timeout 10s adb -s "$serial" shell settings put global animator_duration_scale 0
      - name: Build fixed 0.1.4 baseline with this job's debug certificate
        timeout-minutes: 12
        working-directory: baseline-v014
        run: |
          echo 'c5a643cf80162e665cc228f7b16f343fef868e47d3a4836f62e18b7e17ac018a  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Android UI smoke tests then isolated replacement upgrade
        run: |
          serial=emulator-5554
          capture_device_evidence() {
            result=$?
            echo "Device validation exit: $result"
            timeout 30s adb -s "$serial" logcat -d > device-logcat.txt 2>&1 || true
            timeout 15s adb -s "$serial" exec-out screencap -p > device-screen.png || true
            find app/build -type f \( -path '*/androidTest-results/*' -o -path '*/reports/androidTests/*' \) -print > device-result-files.txt || true
            mkdir -p device-ui-screens
            timeout 30s adb -s "$serial" pull /data/local/tmp/ledger-v013-screens/. device-ui-screens/ > device-ui-screens/pull.log 2>&1 || true
            trap - EXIT
            exit "$result"
          }
          trap capture_device_evidence EXIT
          echo 'c5a643cf80162e665cc228f7b16f343fef868e47d3a4836f62e18b7e17ac018a  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          chmod +x gradlew
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.ledgerCi=true \
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.xiaoliumiaomiao.anjizhang.LedgerUpgradeTest,com.xiaoliumiaomiao.anjizhang.LedgerRawUpgradeSeedTest,com.xiaoliumiaomiao.anjizhang.LedgerSchema2UpgradeTest --no-daemon
          # Connected teardown happens before the upgrade chain. No connected task
          # may run between seeding the old app and verifying the replaced app.
          bash .github/scripts/verify-upgrade.sh \
            baseline-v014/app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sleep 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            emulator-libs.log
            device-logcat.txt
            device-result-files.txt
            device-screen.png
            device-ui-screens/
            upgrade-artifacts/
